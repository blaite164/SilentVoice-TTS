name: Build & Publish OmniVoice Windows Runtime

on:
  push:
    tags:
      - 'omnivoice-runtime-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. omnivoice-runtime-v1)'
        required: true
        default: 'omnivoice-runtime-v1'
        type: string

permissions:
  contents: write

env:
  OMNIVOICE_COMMIT: '040c8b344d8c670ce1475194751d119b5ef82c78'

jobs:
  build-runtime:
    name: Build OmniVoice Windows x64 (${{ matrix.backend }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, cuda]

    steps:
      - name: Checkout SilentVoice repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Vulkan SDK (Vulkan leg)
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vulkanVer = "1.4.357.0"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$vulkanVer/windows/vulkansdk-windows-X64-$vulkanVer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkDir = "C:\VulkanSDK\$vulkanVer"
          if (-not (Test-Path $sdkDir)) { throw "Vulkan SDK directory not found: $sdkDir" }
          "VULKAN_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install CUDA Toolkit 12.4 (CUDA leg)
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: '12.4.1'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          method: 'network'

      - name: Clone and patch omnivoice.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --recurse-submodules https://github.com/ServeurpersoCom/omnivoice.cpp.git omnivoice_src
          git -C omnivoice_src checkout $env:OMNIVOICE_COMMIT
          git -C omnivoice_src submodule update --init --recursive
          python installer/patch_omnivoice_server.py omnivoice_src

      - name: Configure & build tts-server (${{ matrix.backend }})
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = "omnivoice_build_${{ matrix.backend }}"
          $cmakeArgs = @(
            "-S", "omnivoice_src",
            "-B", $buildDir,
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DGGML_BACKEND_DL=ON",
            "-DGGML_CPU_ALL_VARIANTS=ON",
            "-DGGML_NATIVE=OFF",
            "-DCMAKE_BUILD_TYPE=Release"
          )
          if ("${{ matrix.backend }}" -eq "vulkan") {
            $cmakeArgs += @("-DGGML_VULKAN=ON")
          } else {
            $cmakeArgs += @(
              "-DGGML_CUDA=ON",
              "-DGGML_CUDA_FA_ALL_QUANTS=OFF",
              "-DGGML_CUDA_NO_PEER_COPY=ON",
              "-DCMAKE_CUDA_ARCHITECTURES=75-virtual;80-virtual;86-real;89-real"
            )
          }
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Build ALL targets so GGML_BACKEND_DL MODULE_LIBRARY backends (ggml-vulkan, ggml-cuda, ggml-cpu-*) are compiled
          cmake --build $buildDir --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage, smoke-test & zip runtime (${{ matrix.backend }})
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = "omnivoice_build_${{ matrix.backend }}"
          $stageDir = "stage_${{ matrix.backend }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $serverExe = Get-ChildItem -Path $buildDir -Recurse -Filter "tts-server.exe" | Select-Object -First 1
          if (-not $serverExe) { throw "tts-server.exe not found in $buildDir" }
          Copy-Item $serverExe.FullName -Destination (Join-Path $stageDir "tts-server.exe")

          Get-ChildItem -Path $buildDir -Recurse -Filter "ggml*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $stageDir $_.Name) -Force
          }

          if ("${{ matrix.backend }}" -eq "vulkan") {
            if (-not (Test-Path (Join-Path $stageDir "ggml-vulkan.dll"))) {
              throw "ggml-vulkan.dll was not produced!"
            }
          } else {
            if (-not (Test-Path (Join-Path $stageDir "ggml-cuda.dll"))) {
              throw "ggml-cuda.dll was not produced!"
            }
            $cudaBin = Join-Path $env:CUDA_PATH "bin"
            foreach ($dll in @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")) {
              $src = Join-Path $cudaBin $dll
              if (-not (Test-Path $src)) { throw "Missing CUDA runtime DLL: $src" }
              Copy-Item $src -Destination (Join-Path $stageDir $dll) -Force
            }
          }

          # Bundle NEWEST MSVC runtime DLLs (VS 2022 14.4x+, NEVER legacy 14.29 which crashes std::mutex with 0xC0000005!)
          $vsRedistRoots = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC"
          ) | Where-Object { Test-Path $_ }
          foreach ($dllName in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "vcomp140.dll")) {
            $candidates = @()
            foreach ($root in $vsRedistRoots) {
              $candidates += Get-ChildItem -Path $root -Recurse -Filter $dllName -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'onecore|spectre|debug_nonredist' }
            }
            $best = $candidates | Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
            if ($best) {
              Write-Host "Bundling $dllName v$($best.VersionInfo.FileVersion) from $($best.FullName)"
              if ($dllName -eq "msvcp140.dll" -and $best.VersionInfo.FileMinorPart -lt 40) {
                throw "Refusing to bundle stale $dllName v$($best.VersionInfo.FileVersion) (< 14.40)!"
              }
              Copy-Item $best.FullName -Destination (Join-Path $stageDir $dllName) -Force
            }
          }

          # Smoke-test patched --help output (verifies DLL loading + 'steps' & '--api-key' patch)
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $helpOut = & (Join-Path $stageDir "tts-server.exe") --help 2>&1 | Out-String
          $ErrorActionPreference = $prevEap
          Write-Host $helpOut
          if ($helpOut -notmatch "supports 'steps'" -or $helpOut -notmatch "--api-key") {
            throw "Patched flags missing from tts-server.exe --help!"
          }

          New-Item -ItemType Directory -Force -Path "dist_runtime" | Out-Null
          $zipName = "omnivoice-runtime-win-${{ matrix.backend }}-x64.zip"
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath (Join-Path "dist_runtime" $zipName) -Force
          Get-ChildItem "dist_runtime"

      - name: Upload built runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-runtime-${{ matrix.backend }}
          path: dist_runtime/omnivoice-runtime-win-${{ matrix.backend }}-x64.zip
          retention-days: 14

  publish-runtime:
    name: Publish OmniVoice Runtime Release
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Download Vulkan artifact
        uses: actions/download-artifact@v4
        with:
          name: omnivoice-runtime-vulkan
          path: release_assets

      - name: Download CUDA artifact
        uses: actions/download-artifact@v4
        with:
          name: omnivoice-runtime-cuda
          path: release_assets

      - name: Generate SHA256SUMS.txt
        run: |
          cd release_assets
          sha256sum omnivoice-runtime-win-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: OmniVoice Windows Runtime (${{ steps.tag.outputs.name }})
          body: |
            Patched Windows x64 `tts-server.exe` runtime built from `ServeurpersoCom/omnivoice.cpp` (`040c8b344d8c`) for SilentVoice TTS:
            - Supports JSON `steps` (MaskGIT decode steps: 8 / 16 / 24 / 32) and `denoise`
            - Supports `--api-key` local authentication (disables wildcard CORS)
            - Includes `omnivoice-runtime-win-vulkan-x64.zip` (AMD / Intel / NVIDIA Vulkan + CPU variants) and `omnivoice-runtime-win-cuda-x64.zip` (NVIDIA CUDA 12.4 + bundled runtime DLLs)
          files: |
            release_assets/omnivoice-runtime-win-vulkan-x64.zip
            release_assets/omnivoice-runtime-win-cuda-x64.zip
            release_assets/SHA256SUMS.txt

      - name: Mirror Runtime to GitLab (optional, requires GITLAB_TOKEN secret)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN not configured — skipping GitLab mirror."
            exit 0
          fi
          ver="${RELEASE_TAG#omnivoice-runtime-}"
          ver="${ver#v}"
          ver="${ver#V}"
          ver="${ver:-1}"
          base_pkg="https://gitlab.com/api/v4/projects/blaite164%2Fsilentvoice-tts/packages/generic/omnivoice-runtime/${ver}"
          for fname in omnivoice-runtime-win-vulkan-x64.zip omnivoice-runtime-win-cuda-x64.zip SHA256SUMS.txt; do
            echo "Uploading $fname to GitLab Generic Packages (v${ver})..."
            curl -fsSL --retry 3 --retry-delay 5 \
              -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --upload-file "release_assets/${fname}" \
              "${base_pkg}/${fname}"
            echo ""
          done
