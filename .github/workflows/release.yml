name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      fast_build:
        description: 'Fast Inno Setup compression (for test builds)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install dependencies (CPU PyTorch + pinned requirements)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt torchaudio==2.11.1 pyinstaller==6.18.0 noisereduce==3.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -q

      - name: Build installer (PyInstaller + Inno Setup 6)
        shell: pwsh
        run: |
          if ("${{ inputs.fast_build }}" -eq "true") {
            .\build_installer.ps1 -Fast
          } else {
            .\build_installer.ps1
          }

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/installer/SilentVoice_Setup_*.exe
            dist/installer/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentVoice-Windows-Installer
          path: |
            dist/installer/SilentVoice_Setup_*.exe
            dist/installer/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/SilentVoice_Setup_*.exe
            dist/installer/SHA256SUMS.txt

      - name: Mirror Release to GitLab (optional, requires GITLAB_TOKEN secret)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:GITLAB_TOKEN) {
            Write-Host "GITLAB_TOKEN secret is not configured — skipping GitLab release mirror."
            exit 0
          }
          python -c "
          import glob, os, pathlib, requests
          tok = os.environ['GITLAB_TOKEN'].strip()
          tag = os.environ['RELEASE_TAG'].strip()
          ver = tag.lstrip('vV')
          proj = 'blaite164%2Fsilentvoice-tts'
          headers = {'PRIVATE-TOKEN': tok}
          exe_files = sorted(glob.glob('dist/installer/SilentVoice_Setup_*.exe'))
          if not exe_files:
              raise SystemExit('No installer exe found in dist/installer/')
          exe_path = pathlib.Path(exe_files[-1])
          sum_path = pathlib.Path('dist/installer/SHA256SUMS.txt')
          base_pkg = f'https://gitlab.com/api/v4/projects/{proj}/packages/generic/silentvoice/{ver}'
          exe_url = f'{base_pkg}/{exe_path.name}'
          sum_url = f'{base_pkg}/SHA256SUMS.txt'
          with open(sum_path, 'rb') as f:
              r = requests.put(sum_url, headers=headers, data=f, timeout=(30, 120))
              r.raise_for_status()
          with open(exe_path, 'rb') as f:
              r = requests.put(exe_url, headers=headers, data=f, timeout=(30, 600))
              r.raise_for_status()
          sha_line = sum_path.read_text(encoding='utf-8-sig').strip()
          desc = f'SilentVoice TTS {tag}\n\n**SHA-256:**\n' + chr(96)*3 + f'text\n{sha_line}\n' + chr(96)*3
          rel_api = f'https://gitlab.com/api/v4/projects/{proj}/releases'
          payload = {
              'name': f'SilentVoice {tag}',
              'tag_name': tag,
              'ref': 'main',
              'description': desc,
              'assets': {
                  'links': [
                      {'name': exe_path.name, 'url': exe_url, 'link_type': 'package'},
                      {'name': 'SHA256SUMS.txt', 'url': sum_url, 'link_type': 'other'},
                  ]
              },
          }
          if requests.get(f'{rel_api}/{tag}', headers=headers, timeout=20).status_code == 200:
              r = requests.put(f'{rel_api}/{tag}', headers=headers, json={'description': desc}, timeout=30)
          else:
              r = requests.post(rel_api, headers=headers, json=payload, timeout=30)
          r.raise_for_status()
          print('GitLab mirror release published:', tag)
          "
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
