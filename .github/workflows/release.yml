name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      fast_build:
        description: 'Fast Inno Setup compression (for test builds)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install dependencies (CPU PyTorch + pinned requirements)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt torchaudio==2.11.1 pyinstaller==6.18.0 noisereduce==3.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -q

      - name: Build installer (PyInstaller + Inno Setup 6)
        shell: pwsh
        run: |
          if ("${{ inputs.fast_build }}" -eq "true") {
            .\build_installer.ps1 -Fast
          } else {
            .\build_installer.ps1
          }

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/installer/SilentVoice_Setup_*.exe
            dist/installer/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentVoice-Windows-Installer
          path: |
            dist/installer/SilentVoice_Setup_*.exe
            dist/installer/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/SilentVoice_Setup_*.exe
            dist/installer/SHA256SUMS.txt
